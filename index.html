<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Scissors and Rock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <h1>Paper Scissors Rock Game</h1>
          <h5>Press buttons for select your choice</h5>
        </div>
      </div>
    
   
    <div class="card">
      <div class="card-body">See the result.</div>
    </div>

    <div class="btn-group" role="group" aria-label="Простой пример">
      <button type="button" class="btn btn-primary" data-id="1">paper</button>
      <button type="button" class="btn btn-primary" data-id="2">
        scissors
      </button>
      <button type="button" class="btn btn-primary" data-id="3">rock</button>
    </div>
  </div>
    <script src="./app.js"></script>
  </body>
</html>
